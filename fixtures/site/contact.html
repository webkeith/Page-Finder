<!doctype html><html><head><title>Contact — Sample Store</title></head><body>
<h1>Contact us</h1>
<form id="contact-form" name="contact" action="/contact" method="post">
  <label for="n">Name</label><input id="n" name="name" required>
  <label for="e">Email</label><input id="e" name="email" type="email" placeholder="you@example.com" required>
  <label for="m">Message</label><textarea id="m" name="message" placeholder="Ask about a refund or order"></textarea>
  <button type="submit">Send</button>
</form>
<iframe src="/embed" title="Help widget" width="400" height="200"></iframe>
</body></html>
